<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Professional Resume Template -->
  <defs>
    <style>
      .header { fill: #4F46E5; }
      .text { fill: #1F2937; }
      .accent { fill: #E5E7EB; }
      .highlight { fill: #F59E0B; }
      .line { stroke: #D1D5DB; stroke-width: 2; }
      .circle { fill: #4F46E5; }
    </style>
  </defs>
  
  <!-- Template Container -->
  <rect width="400" height="600" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Header Section -->
  <rect x="0" y="0" width="400" height="80" class="header"/>
  
  <!-- Profile Section -->
  <circle cx="50" cy="40" r="20" class="circle"/>
  <text x="75" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="text">John Doe</text>
  <text x="75" y="65" font-family="Arial, sans-serif" font-size="10" class="text">Senior Developer</text>
  
  <!-- Contact Info -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="9" class="text">john@example.com</text>
  <text x="50" y="105" font-family="Arial, sans-serif" font-size="9" class="text">+1 234 567 8900</text>
  
  <!-- Summary Section -->
  <rect x="30" y="120" width="340" height="60" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" class="text">Professional Summary</text>
  <text x="40" y="160" font-family="Arial, sans-serif" font-size="10" class="text">Experienced developer with 5+ years in React and TypeScript...</text>
  
  <!-- Skills Section -->
  <rect x="30" y="200" width="340" height="40" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" class="text">Skills</text>
  <rect x="40" y="240" width="60" height="15" fill="#4F46E5"/>
  <text x="45" y="252" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">React</text>
  <rect x="115" y="240" width="60" height="15" fill="#4F46E5"/>
  <text x="120" y="252" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">TypeScript</text>
  <rect x="190" y="240" width="60" height="15" fill="#4F46E5"/>
  <text x="195" y="252" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF">Node.js</text>
  
  <!-- Experience Section -->
  <rect x="30" y="280" width="340" height="40" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="305" font-family="Arial, sans-serif" font-size="11" font-weight="bold" class="text">Experience</text>
  <text x="40" y="320" font-family="Arial, sans-serif" font-size="10" class="text">Senior Frontend Developer | Tech Corp</text>
  <text x="40" y="335" font-family="Arial, sans-serif" font-size="9" class="text">Jan 2020 - Present</text>
  
  <!-- Education Section -->
  <rect x="30" y="360" width="340" height="40" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="385" font-family="Arial, sans-serif" font-size="11" font-weight="bold" class="text">Education</text>
  <text x="40" y="400" font-family="Arial, sans-serif" font-size="10" class="text">B.Sc Computer Science | MIT</text>
  <text x="40" y="415" font-family="Arial, sans-serif" font-size="9" class="text">CGPA: 8.5/10</text>
  
  <!-- Footer -->
  <rect x="0" y="580" width="400" height="20" fill="#F9FAFB"/>
  <text x="170" y="592" font-family="Arial, sans-serif" font-size="8" class="text" text-anchor="middle">Modern Professional Resume</text>
</svg>