<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Creative Resume Template -->
  <defs>
    <style>
      .header { fill: #EC4899; }
      .text { fill: #374151; }
      .accent { fill: #FBBF24; }
      .highlight { fill: #10B981; }
      .line { stroke: #D1D5DB; stroke-width: 2; }
      .circle { fill: #EC4899; }
    </style>
  </defs>
  
  <!-- Template Container -->
  <rect width="400" height="600" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Header Section -->
  <rect x="0" y="0" width="400" height="120" class="header"/>
  
  <!-- Creative Name -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" class="text">Creative</text>
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" class="text">Portfolio</text>
  
  <!-- Subtitle -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" class="text">Designer & Developer</text>
  
  <!-- Profile Photo -->
  <circle cx="200" cy="160" r="40" fill="#FFFFFF" stroke="#EC4899" stroke-width="3"/>
  <circle cx="200" cy="160" r="35" fill="#FFE4F2"/>
  
  <!-- Creative Skills Grid -->
  <rect x="50" y="220" width="300" height="40" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="55" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" class="text">Creative Skills</text>
  
  <!-- Skill Tags -->
  <rect x="55" y="265" width="70" height="20" rx="10" fill="#EC4899"/>
  <text x="90" y="278" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">UI Design</text>
  
  <rect x="135" y="265" width="70" height="20" rx="10" fill="#EC4899"/>
  <text x="170" y="278" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">UX Research</text>
  
  <rect x="215" y="265" width="70" height="20" rx="10" fill="#EC4899"/>
  <text x="250" y="278" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Branding</text>
  
  <rect x="285" y="265" width="70" height="20" rx="10" fill="#EC4899"/>
  <text x="320" y="278" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Animation</text>
  
  <!-- Projects Section -->
  <rect x="50" y="330" width="300" height="60" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="55" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" class="text">Featured Projects</text>
  <text x="55" y="370" font-family="Arial, sans-serif" font-size="10" class="text">• Mobile Banking App Design</text>
  <text x="55" y="385" font-family="Arial, sans-serif" font-size="10" class="text">• E-commerce Website Redesign</text>
  <text x="55" y="400" font-family="Arial, sans-serif" font-size="10" class="text">• Brand Identity Package</text>
  
  <!-- Contact -->
  <rect x="50" y="410" width="300" height="50" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="55" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" class="text">Get In Touch</text>
  <text x="55" y="450" font-family="Arial, sans-serif" font-size="10" class="text">creative@example.com</text>
  <text x="55" y="465" font-family="Arial, sans-serif" font-size="10" class="text">Portfolio: creative.dev</text>
  
  <!-- Footer -->
  <rect x="0" y="580" width="400" height="20" fill="#F9FAFB"/>
  <text x="200" y="592" font-family="Arial, sans-serif" font-size="8" class="text" text-anchor="middle">Creative Resume Template</text>
</svg>